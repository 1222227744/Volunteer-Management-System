server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:./backend/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/volunteer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

vms:
  bootstrap:
    enabled: ${VMS_BOOTSTRAP_ENABLED:true}
    admin-username: ${VMS_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${VMS_BOOTSTRAP_ADMIN_PASSWORD:admin123}
    admin-display-name: ${VMS_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
    organizer-username: ${VMS_BOOTSTRAP_ORGANIZER_USERNAME:organizer}
    organizer-password: ${VMS_BOOTSTRAP_ORGANIZER_PASSWORD:organizer123}
    organizer-display-name: ${VMS_BOOTSTRAP_ORGANIZER_DISPLAY_NAME:组织方账号}
  demo-data:
    enabled: ${VMS_DEMO_DATA_ENABLED:true}
